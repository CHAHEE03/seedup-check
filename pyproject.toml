[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "settle"
version = "0.1.0"
description = "카드 매출 파일과 계좌 거래 파일을 읽어 주 단위 정산을 맞추는 로컬 스크립트"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
settle = "settle.cli:main"

[tool.setuptools]
packages = ["settle"]
